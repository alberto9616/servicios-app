<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC HOGAR.NET — Gestión</title>

    <!-- QZ Tray: intentar cargar local primero, luego CDN como fallback -->
    <script>
      (function() {
        function configurarQZ() {
          if (!window.qz) return;
          try {
            qz.security.setCertificatePromise(function(resolve) { resolve(""); });
            qz.security.setSignatureAlgorithm("SHA512");
            qz.security.setSignaturePromise(function(toSign) {
              return function(resolve) { resolve(null); };
            });
            window.__qzReady = true;
            console.log("[QZ] Configurado OK");
          } catch(e) { console.warn("[QZ] Config error:", e); }
        }

        // Intentar cargar desde /public/qz-tray.js (sin CSP externa)
        var s = document.createElement("script");
        s.src = "/qz-tray.js";
        s.onload = configurarQZ;
        s.onerror = function() {
          // Fallback al CDN si no está en public
          var s2 = document.createElement("script");
          s2.src = "https://cdn.jsdelivr.net/gh/qzind/tray@2.2/qz-tray.js";
          s2.onload = configurarQZ;
          document.head.appendChild(s2);
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
