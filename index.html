<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC HOGAR.NET — Gestión</title>

    <!-- QZ Tray 2.2 — puente navegador a impresora ESC/POS -->
    <script src="https://cdn.jsdelivr.net/gh/qzind/tray@2.2/qz-tray.js"></script>

    <script>
      // Configurar QZ Tray sin certificado digital (uso red local)
      window.__qzReady = false;

      function configurarQZ() {
        if (!window.qz) return;

        // Sin certificado — cadena vacía acepta conexion sin validacion SSL
        qz.security.setCertificatePromise(function(resolve, reject) {
          resolve("");
        });

        // Sin firma digital
        qz.security.setSignatureAlgorithm("SHA512");
        qz.security.setSignaturePromise(function(toSign) {
          return function(resolve, reject) {
            resolve(null);
          };
        });

        window.__qzReady = true;
        console.log("[QZ Tray] Listo");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", configurarQZ);
      } else {
        configurarQZ();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
